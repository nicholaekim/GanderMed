name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Safety test suite
        run: npm test
      - name: Production build
        run: npm run build
    # No secrets, live Health Canada access, OAuth, or Anthropic credentials
    # are required — DPD calls are mocked in tests and the build is offline.
